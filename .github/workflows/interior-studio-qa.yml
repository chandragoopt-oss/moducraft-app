name: Interior Studio QA
on:
  push:
    branches: [feature/interior-studio]
    paths:
      - 'interior-studio/**'
      - '.github/workflows/interior-studio-qa.yml'
  pull_request:
    branches: [main]
    paths:
      - 'interior-studio/**'
      - '.github/workflows/interior-studio-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: interior-studio/package.json
      - name: Install test dependencies
        working-directory: interior-studio
        run: npm install
      - name: Install Chromium
        working-directory: interior-studio
        run: npx playwright install --with-deps chromium
      - name: Run browser smoke tests
        working-directory: interior-studio
        run: npm test
