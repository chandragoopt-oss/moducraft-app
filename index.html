<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<script>
// ==========================================
// GOOGLE SHEETS DATABASE ADAPTER (SECURED)
// ==========================================
(function() {
  const GOOGLE_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwgMExM7rKaDkJ4-LvUnb_HLpO4TL4-CKDkNEzuSWLiExCetpAT0sox2A1_-NL9clRM/exec";
  
  // MUST MATCH Code.gs EXACTLY
  const API_KEY = "ModuCraft@2026"; 
  
  // 👇 CHANGE THIS TO YOUR ACTUAL EMAIL ADDRESS 👇
  const OWNER_EMAIL = "chandragoopt@gmail.com"; 
  
  async function apiCall(action, collection, id, data) {
    const payload = { action, collection, id, data, apiKey: API_KEY };
    const res = await fetch(GOOGLE_WEB_APP_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload)
    });
    return await res.json();
  }

  const GoogleDB = {
    collection: function(colName) {
      return {
        doc: function(id) {
          return {
            set: async function(data) { return apiCall('write', colName, id, data); },
            delete: async function() { return apiCall('delete', colName, id); }
          };
        },
        onSnapshot: function(callback) {
          apiCall('read', colName).then(res => {
            if (res.ok && res.data) {
              const snapshot = { docChanges: () => Object.keys(res.data).map(id => ({ type: 'added', doc: { id: id, data: () => res.data[id], metadata: { hasPendingWrites: false } } })) };
              callback(snapshot);
            }
          });
          let lastHash = "";
          setInterval(async () => {
            const res = await apiCall('read', colName);
            if (res.ok && res.data) {
               const newHash = JSON.stringify(res.data);
               if (newHash !== lastHash) {
                 lastHash = newHash;
                 const snapshot = { docChanges: () => Object.keys(res.data).map(id => ({ type: 'modified', doc: { id: id, data: () => res.data[id], metadata: { hasPendingWrites: false } } })) };
                 callback(snapshot);
               }
            }
          }, 5000);
        }
      };
    },
    doc: function(path) {
      const parts = path.split('/');
      const colName = parts[0], id = parts[1];
      return {
        set: async function(data) { return apiCall('write', colName, id, data); },
        onSnapshot: function(callback) {
          GoogleDB.collection(colName).onSnapshot(snap => {
            const changes = snap.docChanges().filter(c => c.doc.id === id);
            if (changes.length > 0) callback({ exists: true, data: () => changes[0].doc.data(), metadata: {hasPendingWrites: false} });
          });
        }
      };
    }
  };

    window.claude = window.claude || {};
  window.claude.use = async function(type) {
    if (type === 'db') return GoogleDB;
    
    if (type === 'user') {
      let email = localStorage.getItem('mc_user_email');
      
      // 1. Ask for email if they don't have one saved
      if (!email) {
        email = prompt("Welcome to ModuCraft ERP.\nPlease enter your email address to log in:");
        if (email) { 
          email = email.toLowerCase().trim();
          localStorage.setItem('mc_user_email', email); 
        } else { 
          window.location.reload(); 
          return; 
        }
      }
      
      email = email.toLowerCase().trim();
      const isOwner = (email === OWNER_EMAIL.toLowerCase());

      // 2. If they are NOT the owner, check if they are in the Google Sheet Access List
      if (!isOwner) {
         try {
            // Fetch the access list from Google Sheets
            const res = await apiCall('read', 'access', 'main');
            let allowed = false;
            
            // Check if their email exists in the list
            if (res.ok && res.data && res.data.main && res.data.main.list) {
                const userEntry = res.data.main.list.find(u => 
                    (u.em && u.em.toLowerCase() === email) || 
                    (u.id && u.id === 'user-' + email.replace(/[^a-z0-9]/g, ''))
                );
                if (userEntry) allowed = true;
            }
            
            // If not found, block them completely
            if (!allowed) {
                alert("Access Denied.\n\nYour email (" + email + ") has not been given permission to use this app.\n\nPlease contact the Admin (" + OWNER_EMAIL + ") to request access.");
                localStorage.removeItem('mc_user_email');
                window.location.reload();
                return; 
            }
         } catch(e) {
            alert("Could not connect to the database to verify your email. Please check your internet connection.");
            return;
         }
      }

      // 3. Let them in
      return { 
        can: async () => true, 
        id: async () => 'user-' + email.replace(/[^a-z0-9]/g, ''),
        email: async () => email,
        isOwner: async () => isOwner,
        canEdit: async () => true
      };
    }
    throw new Error("Google Adapter only supports 'db' and 'user'");
  };
  console.log("Secured Google DB Adapter loaded.");
})();

<script>
  if (localStorage.getItem('mc_token')) {
  document.getElementById('loginOverlay').style.display = 'none';
}
document.getElementById('loginBtn').addEventListener('click', async () => {
  const email = document.getElementById('loginEmail').value.trim();
  const pass = document.getElementById('loginPassword').value;
  const btn = document.getElementById('loginBtn');
  const err = document.getElementById('loginError');
  
  if (!email || !pass) {
    err.textContent = "Please enter both email and password.";
    err.style.display = 'block';
    return;
  }

  btn.textContent = "Logging in...";
  btn.disabled = true;
  err.style.display = 'none';

  try {
    const res = await fetch("https://script.google.com/macros/s/AKfycbwgMExM7rKaDkJ4-LvUnb_HLpO4TL4-CKDkNEzuSWLiExCetpAT0sox2A1_-NL9clRM/exec", {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'login', email: email, password: pass })
    });
    const data = await res.json();

        if (data.ok) {
      // Save the token so the app knows you are logged in
      localStorage.setItem('mc_token', data.token);
      localStorage.setItem('mc_user_email', email);
      localStorage.setItem('mc_user_role', data.role);
      if (data.role === 'admin') {
        document.getElementById('adminUsersBtn').style.display = 'inline-block';
      }
      document.getElementById('loginOverlay').style.display = 'none';
    } else {
      err.textContent = data.message || "Login failed.";
      err.style.display = 'block';
      btn.textContent = "Log In";
      btn.disabled = false;
    }
  } catch (error) {
    err.textContent = "Network error. Please try again.";
    err.style.display = 'block';
    btn.textContent = "Log In";
    btn.disabled = false;
  }
});
</script>

          const statusText = isActive ? 'Active' : 'Restricted';
          const actionBtn = isActive 
            ? `<button onclick="toggleUserStatus('${u.email}', false)" style="background:#ef6c00; color:white; border:none; padding:4px 8px; border-radius:4px; cursor:pointer; margin-right:4px;">Restrict</button>`
            : `<button onclick="toggleUserStatus('${u.email}', true)" style="background:#2e7d32; color:white; border:none; padding:4px 8px; border-radius:4px; cursor:pointer; margin-right:4px;">Unrestrict</button>`;
          
          html += `<tr>
            <td style="padding:8px; border-bottom:1px solid #eee;">${u.email}</td>
            <td style="padding:8px; border-bottom:1px solid #eee;">${u.role || 'user'}</td>
            <td style="padding:8px; border-bottom:1px solid #eee; color:${statusColor}; font-weight:bold;">${statusText}</td>
            <td style="padding:8px; border-bottom:1px solid #eee;">
              ${actionBtn}
              <button onclick="deleteUser('${u.email}')" style="background:#c62828; color:white; border:none; padding:4px 8px; border-radius:4px; cursor:pointer;">Delete</button>
            </td>
          </tr>`;
        });
        html += '</table>';
        box.innerHTML = html;
      } else if (data.ok) {
        box.innerHTML = '<p style="color:#333">No users found.</p>';
      } else {
        box.innerHTML = `<p style="color:#c00">Error: ${data.message || 'Could not load users'}</p>`;
      }
    } catch (e) {
      box.innerHTML = '<p style="color:#c00">Network error.</p>';
    }
  }

  async function addAdminUser() {
    const email = document.getElementById('newEmail').value;
    const password = document.getElementById('newPass').value;
    const role = document.getElementById('newRole').value;
    const msg = document.getElementById('addUserMsg');
    msg.textContent = "Adding...";

    const res = await fetch(MC_API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'addUser', token: localStorage.getItem('mc_token'), email, password, role })
    });
    const data = await res.json();
    if (data.ok) {
      loadAdminUsers(); 
    } else {
      msg.textContent = data.message;
    }
  }

  async function toggleUserStatus(email, active) {
    const res = await fetch(MC_API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'setUserStatus', token: localStorage.getItem('mc_token'), email, active })
    });
    const data = await res.json();
    if (data.ok) loadAdminUsers();
    else alert(data.message);
  }

  async function deleteUser(email) {
    if (!confirm("Are you sure you want to delete " + email + "?")) return;
    const res = await fetch(MC_API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'deleteUser', token: localStorage.getItem('mc_token'), email })
    });
    const data = await res.json();
    if (data.ok) loadAdminUsers();
    else alert(data.message);
  }
  }
</script>
