<script>

// GOOGLE SHEETS DATABASE ADAPTER (SECURED)
// ==========================================
(function() {
  const GOOGLE_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwgMExM7rKaDkJ4-LvUnb_HLpO4TL4-CKDkNEzuSWLiExCetpAT0sox2A1_-NL9clRM/exec";
  
  // MUST MATCH Code.gs EXACTLY
  const API_KEY = "ModuCraft@2026"; 
  
  // 👇 CHANGE THIS TO YOUR ACTUAL EMAIL ADDRESS 👇
  const OWNER_EMAIL = "chandragoopt@gmail.com"; 
  
    async function apiCall(action, collection, id, data) {
    // Get the secure token from the user's login session
    const token = localStorage.getItem('mc_token');
    
    // Send the token instead of the API key
    const payload = { action, collection, id, data, token: token };
    
    const res = await fetch(GOOGLE_WEB_APP_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload)
    });
    return await res.json();
  }

  const GoogleDB = {
    collection: function(colName) {
      return {
        doc: function(id) {
          return {
            set: async function(data) { return apiCall('write', colName, id, data); },
            delete: async function() { return apiCall('delete', colName, id); }
          };
        },
        onSnapshot: function(callback) {
          apiCall('read', colName).then(res => {
            if (res.ok && res.data) {
              const snapshot = { docChanges: () => Object.keys(res.data).map(id => ({ type: 'added', doc: { id: id, data: () => res.data[id], metadata: { hasPendingWrites: false } } })) };
              callback(snapshot);
            }
          });
          let lastHash = "";
          setInterval(async () => {
            const res = await apiCall('read', colName);
            if (res.ok && res.data) {
               const newHash = JSON.stringify(res.data);
               if (newHash !== lastHash) {
                 lastHash = newHash;
                 const snapshot = { docChanges: () => Object.keys(res.data).map(id => ({ type: 'modified', doc: { id: id, data: () => res.data[id], metadata: { hasPendingWrites: false } } })) };
                 callback(snapshot);
               }
            }
          }, 5000);
        }
      };
    },
    doc: function(path) {
      const parts = path.split('/');
      const colName = parts[0], id = parts[1];
      return {
        set: async function(data) { return apiCall('write', colName, id, data); },
        onSnapshot: function(callback) {
          GoogleDB.collection(colName).onSnapshot(snap => {
            const changes = snap.docChanges().filter(c => c.doc.id === id);
            if (changes.length > 0) callback({ exists: true, data: () => changes[0].doc.data(), metadata: {hasPendingWrites: false} });
          });
        }
      };
    }
  };

    window.claude = window.claude || {};
  window.claude.use = async function(type) {
    if (type === 'db') return GoogleDB;
    
      if (type === 'user') {
      // Pull the logged-in user's email from localStorage
      const email = (localStorage.getItem('mc_user_email') || '').toLowerCase().trim();
      const isOwner = (email === OWNER_EMAIL.toLowerCase());

      // 3. Let them in
      return { 
        can: async () => true, 
        id: async () => 'user-' + email.replace(/[^a-z0-9]/g, ''),
        email: async () => email,
        isOwner: async () => isOwner,
        canEdit: async () => true
      };
    }
    throw new Error("Google Adapter only supports 'db' and 'user'");
  };
  console.log("Secured Google DB Adapter loaded.");
})();

document.getElementById('loginBtn').addEventListener('click', async () => {

    });

<script>
  // --- Logout Button ---
  document.getElementById('logoutBtn').addEventListener('click', () => {
  localStorage.removeItem('mc_token');
  localStorage.removeItem('mc_user_email');
  localStorage.removeItem('mc_user_role');
  
  // Wipe cached user data (quotations, projects, vendors, audit log, UI prefs).
  // Keep device / licensing keys so the owner does not need to re-import the signing key.
  const KEEP = new Set(['msq_dev','msq_lic','msq_lic_seq','msq_lic_floor','msq_lic_name','msq_seen','msq_owner_key']);
  Object.keys(localStorage)
    .filter(k => k.startsWith('msq_') && !KEEP.has(k))
    .forEach(k => localStorage.removeItem(k));
    
  window.location.reload();
});

  // --- Show Admin Button if logged in as admin ---
  if (localStorage.getItem('mc_user_role') === 'admin') {
    document.getElementById('adminUsersBtn').style.display = 'inline-block';
  }

  // --- Modal Open / Close ---
  document.getElementById('adminUsersBtn').addEventListener('click', () => {
    document.getElementById('adminUsersModal').style.display = 'flex';
    loadAdminUsers();
  });
  
  document.getElementById('closeAdminUsers').addEventListener('click', () => {
    document.getElementById('adminUsersModal').style.display = 'none';
  });

  // --- Admin User Management Logic ---
  const MC_API_URL = "https://script.google.com/macros/s/AKfycbwgMExM7rKaDkJ4-LvUnb_HLpO4TL4-CKDkNEzuSWLiExCetpAT0sox2A1_-NL9clRM/exec";

  async function loadAdminUsers() {
    const box = document.getElementById('adminUsersList');
    box.innerHTML = '<p style="color:#666">Loading users...</p>';
    
    try {
      const res = await fetch(MC_API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: 'listUsers', token: localStorage.getItem('mc_token') })
      });
      const data = await res.json();

      if (data.ok && data.users) {
        let html = `
          <div style="background:#f4f7f6; padding:12px; border-radius:6px; margin-bottom:15px; color:#333;">
            <b style="display:block; margin-bottom:8px;">Add New User</b>

              <input id="newEmail" placeholder="Email address" style="flex:1; min-width:150px; padding:8px; border:1px solid #ccc; border-radius:4px; color:#333;">
              <input id="newPass" placeholder="Password" type="password" style="flex:1; min-width:150px; padding:8px; border:1px solid #ccc; border-radius:4px; color:#333;">

              <th style="padding:8px; border-bottom:2px solid #ddd;">Status</th>
              <th style="padding:8px; border-bottom:2px solid #ddd;">Action</th>
            </tr>`;
        
        data.users.forEach(u => {
          const isActive = u.active === true || u.active === 'true';
          const statusColor = isActive ? '#2e7d32' : '#c62828';

            : `<button onclick="toggleUserStatus('${u.email}', true)" style="background:#2e7d32; color:white; border:none; padding:4px 8px; border-radius:4px; cursor:pointer; margin-right:4px;">Unrestrict</button>`;
          
          html += `<tr>

            <td style="padding:8px; border-bottom:1px solid #eee;">${u.role || 'user'}</td>

        html += '</table>';

    const msg = document.getElementById('addUserMsg');

      body: JSON.stringify({ action: 'addUser', token: localStorage.getItem('mc_token'), email, password, role })
    });
    const data = await res.json();
    if (data.ok) {
    loadAdminUsers();
  } else {
    msg.textContent = data.message || 'Request failed';
  }
  }

  async function toggleUserStatus(email, active) {
    const res = await fetch(MC_API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'setUserStatus', token: localStorage.getItem('mc_token'), email, active })
    });
    const data = await res.json();
    if (data.ok) loadAdminUsers();
  else alert(data.message || 'Request failed');
}

  async function deleteUser(email) {
    if (!confirm("Are you sure you want to delete " + email + "?")) return;
    const res = await fetch(MC_API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'deleteUser', token: localStorage.getItem('mc_token'), email })
    });
    const data = await res.json();
    if (data.ok) loadAdminUsers();
  else alert(data.message || 'Request failed');
}
