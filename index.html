<!DOCTYPE html><html lang="en"><head>
<script>
// ==========================================
// GOOGLE SHEETS DATABASE ADAPTER (SECURED)
// ==========================================
(function() {
  const GOOGLE_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwgMExM7rKaDkJ4-LvUnb_HLpO4TL4-CKDkNEzuSWLiExCetpAT0sox2A1_-NL9clRM/exec";
  const API_KEY = "ModuCraft@2026"; 
  const OWNER_EMAIL = "chandragoopt@gmail.com"; 
  
  async function apiCall(action, collection, id, data) {
    const payload = { action, collection, id, data, apiKey: API_KEY };
    const res = await fetch(GOOGLE_WEB_APP_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload)
    });
    return await res.json();
  }

  const GoogleDB = {
    collection: function(colName) {
      return {
        doc: function(id) {
          return {
            set: async function(data) { return apiCall('write', colName, id, data); },
            delete: async function() { return apiCall('delete', colName, id); }
          };
        },
        onSnapshot: function(callback) {
          apiCall('read', colName).then(res => {
            if (res.ok && res.data) {
              const snapshot = { docChanges: () => Object.keys(res.data).map(id => ({ type: 'added', doc: { id: id, data: () => res.data[id], metadata: { hasPendingWrites: false } } })) };
              callback(snapshot);
            }
          });
          let lastHash = "";
          setInterval(async () => {
            const res = await apiCall('read', colName);
            if (res.ok && res.data) {
               const newHash = JSON.stringify(res.data);
               if (newHash !== lastHash) {
                 lastHash = newHash;
                 const snapshot = { docChanges: () => Object.keys(res.data).map(id => ({ type: 'modified', doc: { id: id, data: () => res.data[id], metadata: { hasPendingWrites: false } } })) };
                 callback(snapshot);
               }
            }
          }, 5000);
        }
      };
    },
    doc: function(path) {
      const parts = path.split('/');
      const colName = parts[0], id = parts[1];
      return {
        set: async function(data) { return apiCall('write', colName, id, data); },
        onSnapshot: function(callback) {
          GoogleDB.collection(colName).onSnapshot(snap => {
            const changes = snap.docChanges().filter(c => c.doc.id === id);
            if (changes.length > 0) callback({ exists: true, data: () => changes[0].doc.data(), metadata: {hasPendingWrites: false} });
          });
        }
      };
    }
  };

    window.claude = window.claude || {};
  window.claude.use = async function(type) {
    if (type === 'db') return GoogleDB;
    if (type === 'user') {
      let email = localStorage.getItem('mc_user_email');
      if (!email) {
        email = prompt("Welcome to ModuCraft ERP.\nPlease enter your email address to log in:");
        if (email) { email = email.toLowerCase().trim(); localStorage.setItem('mc_user_email', email); } 
        else { window.location.reload(); return; }
      }
      email = email.toLowerCase().trim();
      const isOwner = (email === OWNER_EMAIL.toLowerCase());
      if (!isOwner) {
         try {
            const res = await apiCall('read', 'access', 'main');
            let allowed = false;
            if (res.ok && res.data && res.data.main && res.data.main.list) {
                const userEntry = res.data.main.list.find(u => (u.em && u.em.toLowerCase() === email) || (u.id && u.id === 'user-' + email.replace(/[^a-z0-9]/g, '')));
                if (userEntry) allowed = true;
            }
            if (!allowed) {
                alert("Access Denied.\n\nYour email (" + email + ") has not been given permission to use this app.\n\nPlease contact the Admin (" + OWNER_EMAIL + ") to request access.");
                localStorage.removeItem('mc_user_email');
                window.location.reload();
                return; 
            }
         } catch(e) {
            alert("Could not connect to the database to verify your email. Please check your internet connection.");
            return;
         }
      }
      return { 
        can: async () => true, id: async () => 'user-' + email.replace(/[^a-z0-9]/g, ''),
        email: async () => email, isOwner: async () => isOwner, canEdit: async () => true
      };
    }
    throw new Error("Google Adapter only supports 'db' and 'user'");
  };
  console.log("Secured Google DB Adapter loaded.");
})();

${q.rooms.map((rm,i)=>`<section class="card"><div class="rh">${I('q',`rooms|${i}|name`,rm.name)}<span class="mut">${esc(rm.t)}</span><b id="rt${i}"></b><button class="g" data-a="dgo" data-i="${i}">Design walls</button><button class="g" data-a="hpr" data-i="${i}" title="Hide or show every module price of this area on the quotation (the area total stays)">${rm.hpAll?'🙈 Show module prices':'👁 Hide module prices'}</button><button class="g" data-a="mr" data-i="${i}" data-d="-1" title="Move area up"${i==0?' disabled':''}>▲ Up</button><button class="g" data-a="mr" data-i="${i}" data-d="1" title="Move area down"${i==q.rooms.length-1?' disabled':''}>▼ Down</button><button class="g" data-a="dr" data-i="${i}">Remove area</button></div><div class="sc"><table class="g"><tr><th>#<th style="width:20%">Module / Item<th>Length<th>Width / Ht<th>Unit<th>Qty<th>Sq.ft (auto)<th>Basis<th>Material<th>Accessories<th>Rate used<th>Price<th></tr>${rm.rows.map((r,j)=>{const P=`rooms|${i}|rows|${j}|`;return `<tr><td>${j+1}<td><div style="display:flex;gap:2px">${I('q',P+'n',r.n,`list=il_${roomKind(rm)||'all'} data-c=1`)}<select data-pk="${i}|${j}" style="width:36px;padding:0" title="Pick module from list"><option value="">▾</option>${IO}</select></div><td>${N('q',P+'l',r.l)}<td>${N('q',P+'w',r.w)}<td>${SEL('q',P+'u',r.u,Object.keys(FU))}<td>${N('q',P+'q',r.q)}<td class="ro" id="sq${i}_${j}"><td>${SEL('q',P+'b',r.b,['sqft','nos'])}<td>${r.mk&&MOD[r.mk]&&!MOD[r.mk].au?`${I('q',P+'mo',r.mo||'',`list=ml placeholder="${esc(matOf(q,r))}"`)}<div class="mut" style="font-size:10px">${r.mo?'custom text':esc(matOf(q,r))}</div>`:I('q',P+'m',r.m,'list=ml')}<td><button class="g" style="white-space:nowrap" data-a="ao" data-i="${i}" data-j="${j}">${(r.ac||[]).length?r.ac.length+' added':'Add'} ▾</button><td class="ro" id="rr${i}_${j}" style="font-size:11px;font-weight:400;white-space:normal"><td class="ro" id="pr${i}_${j}"><td style="white-space:nowrap"><button class="g" data-a="hp" data-i="${i}" data-j="${j}" title="${r.hp||rm.hpAll?'Price hidden on the quotation — click to show it':'Hide this price on the quotation'}"${rm.hpAll?' disabled':''}>${r.hp||rm.hpAll?'🙈':'👁'}</button><button class="g" data-a="mw" data-i="${i}" data-j="${j}" data-d="-1" title="Move up"${j==0?' disabled':''}>▲</button><button class="g" data-a="mw" data-i="${i}" data-j="${j}" data-d="1" title="Move down"${j==rm.rows.length-1?' disabled':''}>▼</button><button class="g" data-a="dw" data-i="${i}" data-j="${j}">×</button></tr>${S.ao==i+'_'+j?accPanel(rm,r,i,j):''}`}).join('')}</table></div>${modBar(q,rm,i)}<div class="bar"><button data-a="ar" data-i="${i}">+ Add item</button><span class="mut">Type any new item or material — it is added to your catalogue automatically. Dimensions in mm, cm, in, ft or m convert to sq.ft.</span></div></section>`).join('')}
<div class="card bar"><b>Add area:</b><select id="nr" style="max-width:300px">${srt(s.rooms,r=>r.n).map(r=>`<option>${esc(r.n)}</option>`).join('')}</select><button data-a="ad">+ Add to quotation</button><span class="mut">Only added areas appear in the summary and BOQ.</span></div>
${canRate()?`<details class="card"><summary><b>Rates for this client (staff only — never shown on the quotation)</b></summary><p class="mut">Leave blank to use the standard rates from Settings. Prices recalculate instantly.</p><h3>Rate per sq.ft by area</h3><div class="fg">${q.rooms.map((rm,i)=>`<div><label>${esc(rm.name)} (standard ${fmt(rate(q,{t:rm.t},{n:'',b:'sqft'}))}${roomCostRate(q,rm)>0?' · by material costing '+fmt(roomCostRate(q,rm))+'/sq.ft':''})</label>${RB('q',`rooms|${i}|rate`,rm.rate||'','placeholder=standard')}</div>`).join('')}</div><h3>Item-specific rate (overrides area rate)</h3><div class="fg">${u.map(n=>`<div><label>${esc(n)}</label>${RB('q','ir|'+n,(q.ir||{})[n]||'','placeholder=standard')}</div>`).join('')||'<span class=mut>Add items first.</span>'}</div></details>`:''}
<div class="card"><h2>Payment terms</h2><div class="sc"><table class="g" style="min-width:600px"><tr><th>Milestone<th style="width:90px">%<th>Trigger / stage<th>Amount<th></tr>${q.pay.map((p,i)=>`<tr><td>${I('q',`pay|${i}|m`,p.m)}<td>${N('q',`pay|${i}|p`,p.p)}<td>${I('q',`pay|${i}|t`,p.t)}<td class="ro" id="pa${i}"><td><button class="g" data-a="dp" data-i="${i}">×</button></tr>`).join('')}</table></div><div class="bar"><button data-a="ap">+ Add milestone</button><b id="gt" style="margin-left:auto"></b></div></div>
<div class="card"><h2>Notes & exclusions (printed last)</h2>${TA('q','notes',q.notes)}</div>`}

function accPanel(rm,r,i,j){const P=`rooms|${i}|rows|${j}|`,ac=r.ac||[],have=ac.map(a=>a.n),sug=((S.set.am.find(x=>x.i==r.n)||{}).a||[]).filter(n=>!have.includes(n)).sort(),cats=[...new Set(S.set.acc.map(a=>a.c||'Other'))].sort(),D=`data-i="${i}" data-j="${j}"`;
return `<tr><td colspan=13><div class="acp">${modOpts(rm,r,i,j,P)}<b>Accessories — ${esc(r.n)||'this item'}</b><span class="mut"> (rate 0 = included in module rate)</span>
${ac.map((a,k)=>`<div class="acr"><span>${esc(a.n)} <small class="mut">${esc(accU(a.n))}${canRate()&&accRate(a.n,T())?' • '+fmt(accRate(a.n,T()))+' each':''}</small></span>${N('q',P+`ac|${k}|q`,a.q)}<button class="g" data-a="xa" ${D} data-k="${k}">×</button></div>`).join('')||'<div class="mut">None added yet.</div>'}
${sug.length?`<div style="margin-top:6px"><span class="mut">Suggested for ${esc(r.n)}:</span> ${sug.map(n=>`<button class="chip" data-a="aa" ${D} data-v="${esc(n)}">+ ${esc(n)}</button>`).join('')}</div>`:''}
<div class="bar"><select id="asel" style="max-width:320px"><option value="">Add from full accessory list…</option>${cats.map(c=>`<optgroup label="${esc(c)}">${srt(S.set.acc.filter(a=>(a.c||'Other')==c),a=>a.n).map(a=>`<option>${esc(a.n)}</option>`).join('')}</optgroup>`).join('')}</select><button data-a="as" ${D}>+ Add</button></div>
<div class="bar"><input id="nan" placeholder="New accessory name"><input id="nac" placeholder="Category" list="cl"><select id="nau" style="max-width:90px">${['nos','set','pair','rmt','sqft'].map(u=>`<option>${u}</option>`).join('')}</select>${canRate()?'<input id="nar" type="number" min="0" placeholder="Rate ₹ (optional)" style="max-width:140px">':''}<label class="mut"><input type="checkbox" id="nas" checked style="width:auto"> suggest for ${esc(r.n)||'this item'}</label><button data-a="an" ${D}>Create &amp; add</button><datalist id="cl">${cats.map(c=>`<option value="${esc(c)}">`).join('')}</datalist></div>
<div><label class="mut">Other accessory notes</label>${I('q',P+'a',r.a)}</div><div class="bar"><button class="g" data-a="ao" ${D}>Close</button></div></div></tr>`}
const amCard=()=>`<div class="card"><h2>Suggested accessories per furniture item</h2><p class="mut">These appear as one-tap suggestions inside each item's Accessories panel. New rows (blank name) appear at the top.</p><input class="flt" data-flt data-fk="am" placeholder="🔍 Search furniture / accessory…" style="max-width:380px;margin-bottom:6px"><div class="sc"><table class="g" style="min-width:560px"><tr><th>Furniture / item<th>Suggested accessories (one per line)<th></tr>${sidx(S.set.am,x=>x.i||'').map(i=>{const x=S.set.am[i];return `<tr data-r="1"><td>${I('s',`am|${i}|i`,x.i,'list=il')}<td>${TA('s',`am|${i}|a`,x.a,1)}<td><button class="g" data-a="sd" data-k="am" data-i="${i}">×</button></tr>`}).join('')}</table></div><div class="bar"><button data-a="sa" data-k="am">+ Add</button></div></div>`;
function addAcc(r,n){r.ac=r.ac||[];const e=r.ac.find(a=>a.n==n);e?e.q=(+e.q||0)+1:r.ac.push({n,q:1});save('q',S.cur)}

function accAgg(q){const m={};q.rooms.forEach(rm=>rm.rows.forEach(r=>rowAcc(r).forEach(a=>{const e=m[a.n]||(m[a.n]={n:a.n,q:0,u:[]});e.q+=+a.q||0;e.u.push(`${rm.name}: ${r.n||'item'}${a.q>1?' ×'+a.q:''}`)})));return Object.values(m).sort((a,b)=>((accF(a.n).c||'~')+a.n).localeCompare((accF(b.n).c||'~')+b.n))}
function accData(){const q=T(),all=!q||S.as=='all';if(!all)return{all,rows:accAgg(q).map(e=>({...e,c:accF(e.n).c||'Other',un:accU(e.n),std:+accF(e.n).r||0,rt:accRate(e.n,q),k:1}))};
const m={};Object.values(S.q).forEach(x=>accAgg(x).forEach(e=>{const g=m[e.n]||(m[e.n]={n:e.n,q:0,amt:0,k:0,c:accF(e.n).c||'Other',un:accU(e.n),std:+accF(e.n).r||0});g.q+=e.q;g.amt+=e.q*accRate(e.n,x);g.k++}));return{all,rows:Object.values(m).sort((a,b)=>(a.c+a.n).localeCompare(b.c+b.n))}}
function vAcc(){const h=vAcc0();return(S.apdf||!canRate()||accData().all)?h:h+hwBrands()}
function vAcc0(){if(S.apdf)return vAccPdf();if(!canRate())return vAccList();const q=T(),d=accData(),all=d.all,rows=d.rows,tq=rows.reduce((t,e)=>t+e.q,0),ta=rows.reduce((t,e)=>t+(all?e.amt:e.q*e.rt),0);
return `<div class="warn noprint" style="background:#fde2e2;color:#7a1f1f"><b>INTERNAL ONLY</b> — rates and costs on this page are never shown on the client quotation.</div>
<div class="bar noprint">${q?`<button class="${all?'g':''}" data-a="asc" data-v="q">This quotation: ${esc(q.name)||'(no name)'}</button>`:''}<button class="${all?'':'g'}" data-a="asc" data-v="all">All quotations (total count)</button><button data-a="apdf">Accessory list PDF (no rates)</button><button class="g" data-a="acsv">Download CSV</button><button class="g" data-a="ap">Print</button></div>
<div class="card"><h2>Accessories — ${all?'all quotations':esc(q.name)+' • '+esc(qno(q))}</h2><p class="mut">${all?'Total quantity and cost of every accessory across all saved quotations, using each client’s own rate.':'Rate for this client: type a rate to override the standard rate — the quotation re-prices automatically. Leave blank to use the standard rate. Rate 0 = included in module rate.'}</p><div class="sc"><table class="g"><tr><th>#<th>Accessory<th>Category<th>Unit<th class="ro">Total qty${all?'<th class="ro">Quotations':'<th class="ro">Standard rate<th>Rate for this client'}<th class="ro">Amount${all?'':'<th>Used in'}</tr>
${rows.map((e,i)=>{const o=!all&&(q.ar||[]).find(x=>x.n==e.n);return `<tr><td>${i+1}<td>${esc(e.n)}<td>${esc(e.c)}<td>${esc(e.un)}<td class="ro">${e.q}${all?`<td class="ro">${e.k}`:`<td class="ro">${fmt(e.std)}<td><span style="display:flex;gap:4px"><input type="number" min="0" step="any" data-ar="${esc(e.n)}" value="${o?esc(o.r):''}" placeholder="${e.std}" style="max-width:110px"><button class="g" data-a="sr" data-d="q">Save</button></span>`}<td class="ro" id="aa${i}">${fmt(all?e.amt:e.q*e.rt)}${all?'':`<td style="font-size:12px">${esc(e.u.join('; '))}`}</tr>`}).join('')||'<tr><td colspan=9 class="mut">No accessories added to any item yet. Open Edit → item → Accessories.</tr>'}
<tr class="tot"><td><td><b>TOTAL</b><td><td><td class="ro"><b>${tq}</b>${all?'<td>':'<td><td>'}<td class="ro"><b id="att">${fmt(ta)}</b>${all?'':'<td>'}</tr></table></div></div>`}
function arCalc(){const q=T();if(!q)return;let t=0;accAgg(q).forEach((e,i)=>{const a=e.q*accRate(e.n,q);t+=a;set('aa'+i,fmt(a))});set('att',fmt(t))}
document.addEventListener('input',e=>{const t=e.target;if(t.dataset.ar===undefined||!S.w)return;const q=T(),n=t.dataset.ar;q.ar=(q.ar||[]).filter(x=>x.n!=n);if(t.value!=='')q.ar.push({n,r:parseFloat(t.value)||0});q.ts=Date.now();arCalc();save('q',S.cur)});
const ARTL='https://claude.ai/artifact/AMyyVLVyJG8mGHWjME2T1J';
function vAccList(){const q=T(),d=accData(),all=d.all;return `<div class="bar noprint">${q?`<button class="${all?'g':''}" data-a="asc" data-v="q">This quotation</button>`:''}<button class="${all?'':'g'}" data-a="asc" data-v="all">All quotations</button><button data-a="apdf">Accessory list PDF</button></div><div class="card"><h2>Accessory list — ${all?'all quotations':esc(q.name)+' • '+esc(qno(q))}</h2><div class="sc"><table class="g"><tr><th>#<th>Accessory<th>Category<th>Unit<th class="ro">Total qty<th>${all?'Quotations':'Used in'}</tr>${d.rows.map((e,i)=>`<tr><td>${i+1}<td>${esc(e.n)}<td>${esc(e.c)}<td>${esc(e.un)}<td class="ro">${e.q}<td style="font-size:12px">${all?e.k:esc(e.u.join('; '))}</tr>`).join('')||'<tr><td colspan=6 class="mut">No accessories added yet.</tr>'}</table></div></div>`}
function vAccPdf(){const q=T(),d=accData(),all=d.all,c=co(),by=all?lastBy():q.by,hd=`<div class="hd"><img src="${LOGO}" alt="logo"><div class="ct"><b>${esc(c.name)}</b><br>${esc(c.addr)}<br>Call - ${esc(c.phone)} | ${esc(c.web)} | ${esc(c.mail||CE)}</div><div class="cl">${all?'<b>ACCESSORY LIST</b><br>All quotations':`Client: <b>${esc(q.name)}</b><br>${esc(q.project)}<br>Quote No.: ${esc(qno(q))}<br>Date: ${esc(qd(q))}`}${by?`<br>Prepared by: <b>${esc(by)}</b>`:''}</div></div>`,ft=`<div class="ft">${esc(c.name)} &nbsp;|&nbsp; ${esc(c.web)} &nbsp;|&nbsp; ${esc(c.mail||CE)}<br><small>Prepared with ${SW} — Quotation &amp; BOQ software by Module Studio · © ${new Date().getFullYear()} Module Studio</small></div>`,
body=`<h2 style="text-align:center;letter-spacing:4px">ACCESSORY LIST</h2><table class="t"><tr><th>No.<th>Accessory<th>Category<th>Unit<th class="r">Total qty<th>${all?'Quotations':'Used in'}</tr>${d.rows.map((e,i)=>`<tr><td>${i+1}<td>${esc(e.n)}<td>${esc(e.c)}<td>${esc(e.un)}<td class="r">${e.q}<td>${all?e.k:esc(e.u.join('; '))}</tr>`).join('')||'<tr><td colspan=6>No accessories added.</tr>'}<tr class="tot"><td colspan=4 class="r">Total accessories<td class="r">${d.rows.reduce((t,e)=>t+e.q,0)}<td></tr></table>`;
return `<div class="bar noprint"><button data-a="dpdf" data-acc="1">Download PDF</button><button class="g" data-a="aprint">Print</button><button class="g" data-a="adl">Download file</button><button class="g" data-a="apdf0">← Back</button><span class="mut">No rates or amounts appear on this sheet.</span></div><div class="paper"><table class="doc"><thead><tr><td>${hd}</td></tr></thead><tbody><tr><td>${body}</td></tr></tbody><tfoot><tr><td>${ft}</td></tr></tfoot></table></div>`}
function vShare(){if(window.__OFFLINE)return licInfoCard()+(localStorage.getItem('msq_owner_key')?licOwnerCard():'');const adm=S.role=='Owner'||S.role=='Editor';return `<div class="card"><h2>Access & Sharing</h2><p>Your access: <b>${esc(S.role||'Unknown')}</b> • screen level: <b>${LN[S.lvl||'full']}</b> — ${S.w?'you can edit and save.':'view only, changes are not saved.'}</p><div class="bar"><input id="lnk" readonly value="${ARTL}" style="max-width:420px"><button data-a="cp">Copy app link</button>${S.lvl=='view'||S.w0===false?'':`<button class="g" data-a="lk">${S.lock?'Switch back to edit mode':'Switch to view-only mode'}</button>`}</div></div>
${adm?`<div class="card"><h3>People &amp; access levels — you decide</h3><ol><li>Invite the person in claude.ai → <b>Share</b> (Viewer = cannot save, Contributor = can save).</li><li>Search their name below and choose what they may see in this app.</li></ol><p class="mut">Anyone not listed: Contributors get Full access, view-only invitees get Viewer level.</p><div class="bar"><input id="aem" type="email" placeholder="Partner's email address" style="max-width:300px"><select id="alv" style="max-width:240px">${Object.entries(LN).map(([k,v])=>`<option value="${k}"${k=='view'?' selected':''}>${v}</option>`).join('')}</select><button data-a="ae">Add by email &amp; prepare invite</button></div><p class="mut">This saves the email with an in-app level and opens an invitation email with the app link. The person must <b>also</b> be invited in claude.ai → Share (the app cannot send claude.ai invitations). The level is matched when they open the app, if their account shares its email with the app; otherwise add them by name below after their first visit.</p><input id="psq" data-ps placeholder="Or search a person by name…" style="max-width:340px"><div id="psr"></div><div class="sc"><table class="g" style="min-width:520px"><tr><th>Person<th>Level<th></tr>${S.acl.map(x=>`<tr><td ${x.id?`data-pn="${esc(x.id)}"`:''}>${x.id?'…':esc(x.em)+' <span class="mut">(applies when they open the app)</span>'}<td><select data-acl="${esc(x.id||x.em)}">${Object.entries(LN).map(([k,v])=>`<option value="${k}"${x.lvl==k?' selected':''}>${v}</option>`).join('')}</select><td><button class="g" data-a="acx" data-id="${esc(x.id||x.em)}">Remove</button></tr>`).join('')||'<tr><td colspan=3 class="mut">No one listed yet.</tr>'}</table></div></div>`:''}
${adm?teamCard()+licOwnerCard():''}<div class="card"><h3>What each level sees</h3><div class="sc"><table class="g" style="min-width:560px"><tr><th>Level<th>Quotations<th>Rates / Settings page<th>Accessory list</tr><tr><td><b>Full access</b><td>Create / edit / delete<td>Yes<td>With rates and amounts</tr><tr><td><b>Staff</b><td>Create / edit / delete<td>Hidden<td>Quantities only (no rates)</tr><tr><td><b>Viewer</b><td>View and preview only<td>Hidden<td>Quantities only, plus PDF</tr></table></div></div>
<div class="card"><h3>Diagnostics</h3><p class="mut">Cloud: <b>${S.db?'connected':'NOT connected'}</b> • Write permission: <b>${S.w?'yes':'no'}</b> • Modules: ${S.set.items.length} • Rooms: ${S.set.rooms.length} • Accessories: ${S.set.acc.length}</p><button class="g" data-a="dg">Test cloud save</button></div>
<div class="card"><h3>Important</h3><p>These levels control what each person's <b>screen</b> shows. Everyone invited to the app technically receives its stored data, so a technically skilled person could still look up rates. For anyone who must <b>never</b> see your rates, don't invite them — send the <b>Accessory list PDF</b> (Accessory List tab → Accessory list PDF) or the client quotation instead.</p></div>`}
</script>
