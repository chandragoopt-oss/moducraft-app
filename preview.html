<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script>
// ==========================================
// GOOGLE SHEETS DATABASE ADAPTER (SECURED)
// ==========================================
(function() {
  const GOOGLE_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwgMExM7rKaDkJ4-LvUnb_HLpO4TL4-CKDkNEzuSWLiExCetpAT0sox2A1_-NL9clRM/exec";
  const OWNER_EMAIL = "chandragoopt@gmail.com"; 
  
  async function apiCall(action, collection, id, data) {
    const token = localStorage.getItem('mc_token');
    const payload = { action, collection, id, data, token: token };
    const res = await fetch(GOOGLE_WEB_APP_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload)
    });
    return await res.json();
  }

  const GoogleDB = {
    collection: function(colName) {
      return {
        doc: function(id) {
          return {
            set: async function(data) { return apiCall('write', colName, id, data); },
            delete: async function() { return apiCall('delete', colName, id); }
          };
        },
        onSnapshot: function(callback) {
          apiCall('read', colName).then(res => {
            if (res.ok && res.data) {
              const snapshot = { docChanges: () => Object.keys(res.data).map(id => ({ type: 'added', doc: { id: id, data: () => res.data[id], metadata: { hasPendingWrites: false } } })) };
              callback(snapshot);
            }
          });
          let lastHash = "";
          setInterval(async () => {
            const res = await apiCall('read', colName);
            if (res.ok && res.data) {
               const newHash = JSON.stringify(res.data);
               if (newHash !== lastHash) {
                 lastHash = newHash;
                 const snapshot = { docChanges: () => Object.keys(res.data).map(id => ({ type: 'modified', doc: { id: id, data: () => res.data[id], metadata: { hasPendingWrites: false } } })) };
                 callback(snapshot);
               }
            }
          }, 5000);
        }
      };
    },
    doc: function(path) {
      const parts = path.split('/');
      const colName = parts[0], id = parts[1];
      return {
        set: async function(data) { return apiCall('write', colName, id, data); },
        onSnapshot: function(callback) {
          GoogleDB.collection(colName).onSnapshot(snap => {
            const changes = snap.docChanges().filter(c => c.doc.id === id);
            if (changes.length > 0) callback({ exists: true, data: () => changes[0].doc.data(), metadata: {hasPendingWrites: false} });
          });
        }
      };
    }
  };

  window.claude = window.claude || {};
  window.claude.use = async function(type) {
    if (type === 'db') return GoogleDB;
    if (type === 'user') {
      const email = (localStorage.getItem('mc_user_email') || '').toLowerCase().trim();
      const isOwner = (email === OWNER_EMAIL.toLowerCase());
      return { 
        can: async () => true, 
        id: async () => 'user-' + email.replace(/[^a-z0-9]/g, ''),
        email: async () => email,
        name: async () => localStorage.getItem('mc_user_name') || email,
        profiles: async () => ({}),
        isOwner: async () => isOwner,
        canEdit: async () => true
      };
    }
  };
})();
</script>
