<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Design Studio - ModuCraft</title>
<link rel="stylesheet" href="style.css">
</head>
<body data-theme="dark">

  <header class="top-nav">
    <div class="logo-area">
      <h1>ModuCraft ERP</h1>
      <div style="display:flex; gap:10px; align-items:center; margin-left:20px;">
        <select id="active-room-select" onchange="switchRoom(this.value)" style="padding:8px; border-radius:4px; border:1px solid var(--border-color); background:var(--bg-main); color:var(--text-main); font-weight:bold; max-width:200px;">
          <option value="0">Loading...</option>
        </select>
        <select id="room-shape-select" onchange="changeRoomShape(this.value)" style="padding:8px; border-radius:4px; border:1px solid var(--border-color); background:var(--bg-main); color:var(--text-main);">
          <option value="rectangle">Rectangle</option>
          <option value="l-shape">L-Shape</option>
          <option value="u-shape">U-Shape</option>
        </select>
      </div>
    </div>
    <nav class="main-links"><button>Dashboard</button><button class="active">Design Studio</button></nav>
  </header>

  <div class="sub-header">
    <div class="action-tabs">
      <button class="active" onclick="updateRightPanel('View & Tools', this)">View & Tools</button>
      <button onclick="updateRightPanel('Room Setting', this)">Room Setting</button>
      <button onclick="updateRightPanel('Site Structure', this)">Site Structure</button>
      <button onclick="updateRightPanel('Auto Loft', this)">Auto Loft</button>
    </div>
  </div>

  <div class="workspace-grid">
    <div class="left-col" id="elevations-container"></div>

    <div class="panel center-col" id="box-center" data-view="plan">
      <div class="panel-header" onclick="changeView('plan')" style="cursor:pointer;">
        <span id="center-title">Plan View</span> 
        <span style="font-size:11px;color:var(--text-muted);font-weight:normal; text-transform:none;">(Scroll to Zoom)</span>
      </div>
      
      <div class="plan-viewport" id="viewport">
        <div class="view-container active" id="view-plan">
          <div class="plan-canvas" id="plan"></div>
        </div>
        <div class="view-container" id="view-alt">
          <div id="alt-content" style="width:100%; height:100%; position:relative;">
              <div class="zoom-wrapper"></div>
          </div>
        </div>
        <div class="float-3d-btn" onclick="changeView('persp')">🧊 3D View</div>
      </div>
    </div>

    <div class="right-col">
      <div class="panel toolbar-panel">
        <div class="panel-header">Toolbar</div>
        <div class="toolbar-content" id="toolbar-content"></div>
      </div>
      <div class="panel properties-panel">
        <div class="panel-header">
          <span id="prop-title">Details</span>
          <button onclick="selectedId=null; selectedType=null; updateAllViews();" style="background:none; border:none; color:var(--text-main); cursor:pointer;">&times;</button>
        </div>
        <div class="properties-content" id="prop-body">
          <p style="color:var(--text-muted); font-size:13px;">Select an item on the plan.</p>
        </div>
      </div>
    </div>
  </div>

  <div class="quick-add-modal" id="quick-add-modal">
    <div class="quick-add-box">
      <input type="text" id="quick-add-input" placeholder="Search modules..." onkeyup="filterQuickAdd()">
      <div class="quick-add-list" id="quick-add-list"></div>
    </div>
  </div>

  <script src="drawing.js"></script>
  <script src="setup.js"></script>
</body>
</html>
